name: Build container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Build frontend
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/clouduh/songzuo:latest
            ghcr.io/clouduh/songzuo:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CLOUDUH/songzuo
            org.opencontainers.image.description=Lightweight sedentary monitoring for an MJPEG camera
          cache-from: type=gha
          cache-to: type=gha,mode=max
