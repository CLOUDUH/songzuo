services:
  songzuo:
    image: ghcr.io/clouduh/songzuo:latest
    pull_policy: always
    container_name: songzuo
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BARK_SERVER: ${BARK_SERVER:-https://api.day.app}
      BARK_DEVICE_KEY: ${BARK_DEVICE_KEY:-}
      GENERIC_WEBHOOK_URL: ${GENERIC_WEBHOOK_URL:-}
      CAMERA_STREAM_URL: ${CAMERA_STREAM_URL:-http://192.168.1.80:2345/}
      CAMERA_USERNAME: ${CAMERA_USERNAME:-}
      CAMERA_PASSWORD: ${CAMERA_PASSWORD:-}
      CAMERA_AUTH_TYPE: ${CAMERA_AUTH_TYPE:-basic}
      CAMERA_VERIFY_TLS: ${CAMERA_VERIFY_TLS:-true}
      CAMERA_SETTINGS_PATH: /app/data/camera-settings.json
      DETECTOR_MODE: ${DETECTOR_MODE:-auto}
      DETECTOR_INPUT_SIZE: ${DETECTOR_INPUT_SIZE:-320}
      OPENCV_THREADS: ${OPENCV_THREADS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8787:8000"
    volumes:
      - songzuo-data:/app/data
      - songzuo-models:/app/models:ro
    mem_limit: 512m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

volumes:
  songzuo-data:
    name: songzuo-data
  songzuo-models:
    name: songzuo-models
