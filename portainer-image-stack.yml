services:
  songzuo:
    image: ghcr.io/clouduh/songzuo:latest
    pull_policy: always
    container_name: songzuo
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CAMERA_SETTINGS_PATH: /app/data/camera-settings.json
      NOTIFICATION_SETTINGS_PATH: /app/data/notification-settings.json
      DETECTOR_MODE: ${DETECTOR_MODE:-auto}
      DETECTOR_INPUT_SIZE: ${DETECTOR_INPUT_SIZE:-320}
      OPENCV_THREADS: ${OPENCV_THREADS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8787:8000"
    volumes:
      - songzuo-data:/app/data
      - songzuo-models:/app/models:ro
    mem_limit: 512m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

volumes:
  songzuo-data:
    name: songzuo-data
  songzuo-models:
    name: songzuo-models
